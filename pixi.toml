[workspace]
name = "cuplyr"
version = "0.0.1"
description = "GPU-accelerated dplyr backend via RAPIDS libcudf"
channels = ["rapidsai", "conda-forge", "nvidia"]
platforms = ["linux-64"]

[dependencies]
pandoc = ">=3.0"

# RAPIDS C++ libraries (from conda, with headers). Two series, one environment
# each: `default` is the one cuplyr is developed, tested and gated on (26.10);
# `rapids2602` is the declared minimum, checked at release time with
# `pixi run -e rapids2602 conformance` or CUPLYR_PIXI_ENV=rapids2602 tools/conformance.
# Each environment also carries the CUDA 13 build tools (nvcc, the runtime and
# crt headers, the libcuda stub), so a machine without a system CUDA toolkit can
# build cuplyr. They are the same packages as the conda recipe's: cuda-nvcc-tools
# rather than cuda-nvcc, which would also bring conda's own host compiler.
# ./configure prefers CUDA_HOME when it is set, so a system toolkit still wins
# where one is configured.
[feature.rapids2610.dependencies]
libcudf = "26.10.*"
librmm = "26.10.*"
libkvikio = "26.10.*"
cuda-version = "13.*"
cuda-nvcc-tools = "13.*"
cuda-cudart-dev = "13.*"
cuda-crt-dev_linux-64 = "13.*"
cuda-driver-dev = "13.*"

[feature.rapids2602.dependencies]
libcudf = "26.02.*"
librmm = "26.02.*"
libkvikio = "26.02.*"
cuda-version = "13.*"
cuda-nvcc-tools = "13.*"
cuda-cudart-dev = "13.*"
cuda-crt-dev_linux-64 = "13.*"
cuda-driver-dev = "13.*"

[environments]
default = ["rapids2610"]
rapids2602 = ["rapids2602"]

[tasks]
configure = { cmd = "./configure", description = "Detect paths, generate Makevars" }
install = { cmd = "R CMD INSTALL .", depends-on = ["configure"], description = "Configure and install R package" }
test = { cmd = "tools/test", description = "Full test suite (GPU lock, load_all)" }
test-file = { cmd = "tools/test-file", description = "Run given test files (GPU lock, load_all)" }
perf = { cmd = "tools/perf", description = "Perf regression gate (GPU lock)" }
conformance = { cmd = "tools/conformance", description = "dplyr conformance harness (GPU lock)" }
document = { cmd = "tools/document", description = "Regenerate NAMESPACE, man/, Rcpp exports (GPU lock)" }
build-dll = { cmd = "tools/build", description = "Compile C++ in place (no install, no lock)" }
check = { cmd = "_R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --ignore-vignettes cuplyr_*.tar.gz", depends-on = ["build"], description = "R CMD check (tarball)" }
clean = { cmd = "rm -f src/*.o src/*.so src/Makevars 2>/dev/null || true", description = "Clean artifacts" }
dev = { cmd = "./configure && R CMD INSTALL .", depends-on = ["clean"], description = "Clean rebuild" }
bench = { cmd = "Rscript inst/benchmarks/run_benchmarks.R", description = "Run benchmarks" }
r = { cmd = "R", description = "Start R with pixi environment" }
load-dev = { cmd = "tools/r 'invisible(NULL)'", description = "Load package in dev mode (GPU lock)" }
check-deps = { cmd = "R -e 'devtools::load_all(); check_deps()'", description = "Check dependencies for cuplyr" }
pkgdown = { cmd = "tools/site", description = "Build pkgdown site into docs/ (GPU lock)" }
site-publish = { cmd = "tools/site-publish", description = "Build the site from main and publish it to gh-pages" }

[tasks.build]
cmd = "./scripts/build-tarball.sh"
depends-on = ["configure"]
description = "Build source tarball (excludes .pixi)"

[tasks.full-check]
cmd = "_R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --ignore-vignettes cuplyr_*.tar.gz --as-cran"
depends-on = ["build"]
description = "Full CRAN-style check"
