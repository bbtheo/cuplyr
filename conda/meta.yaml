{% set version = "0.1.1.9000" %}
# r-cuplyr: the conda package of cuplyr (dplyr on the GPU via RAPIDS libcudf).
#
# This is the recipe for conda-build. conda/recipe.yaml describes the same
# package for rattler-build, the preferred tool; keep the two in step. See
# conda/README.md for the build and test steps.
#
# Build (from the repository root):
#   conda build conda/ -m conda/variants.yaml \
#     -c rapidsai -c conda-forge -c nvidia --output-folder <dir>
#
# rapids_version, cuda_version and the C standard library and compiler
# versions come from conda/variants.yaml, which conda-build does not read on
# its own: pass it with -m. Each rapids_version is a separate binary (RAPIDS
# has no ABI across series). The version above is
# kept equal to Version in DESCRIPTION (a test checks it).

package:
  name: r-cuplyr
  version: {{ version }}

source:
  # The local checkout, so the package built is the one being released.
  # conda-build copies the whole directory, so build from a clean checkout.
  path: ..

build:
  number: 0
  skip: true  # [not linux]
  # No script here: conda-build runs conda/build.sh by itself.

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    # R and the packages cuplyr imports (DESCRIPTION Imports), with the same
    # minimum versions. Rcpp is also in LinkingTo.
    - r-base >=4.3.0
    - r-rcpp >=1.0.12
    - r-dplyr >=1.1.0
    - r-rlang >=1.1.0
    - r-vctrs >=0.6.0
    - r-cli >=3.6.0
    - r-lifecycle >=1.0.5
    - r-tidyselect >=1.2.0
    - r-tibble >=3.2.0
    - r-pillar
    # RAPIDS, all on the same series.
    - libcudf {{ rapids_version }}.*
    - librmm {{ rapids_version }}.*
    - libkvikio {{ rapids_version }}.*
    # CUDA. configure needs nvcc and the CUDA headers in one prefix, so
    # cuda-nvcc-tools (bin/nvcc, without cuda-nvcc's host compiler and its
    # activation scripts) is a host requirement, not a build one.
    # cuda-driver-dev provides the stub libcuda that is linked (see
    # conda/README.md).
    - cuda-version {{ cuda_version }}.*
    - cuda-nvcc-tools
    - cuda-cudart-dev
    - cuda-driver-dev
  run:
    - {{ pin_compatible('r-base', max_pin='x.x') }}
    - r-rcpp >=1.0.12
    - r-dplyr >=1.1.0
    - r-rlang >=1.1.0
    - r-vctrs >=0.6.0
    - r-cli >=3.6.0
    - r-lifecycle >=1.0.5
    - r-tidyselect >=1.2.0
    - r-tibble >=3.2.0
    - r-pillar
    # The binary needs the libcudf series it was built against (libcudf's own
    # run_exports pin it too), and its RMM and KvikIO.
    - libcudf {{ rapids_version }}.*
    - librmm {{ rapids_version }}.*
    - libkvikio {{ rapids_version }}.*
    # The CUDA runtime comes from cuda-cudart-dev's run_exports, and
    # cuda-version from libcudf. The NVIDIA driver is the user's own.

test:
  # Needs no GPU: loads the package and checks that libcudf and librmm
  # resolve inside the environment (see conda/test-package.R).
  files:
    - test-package.R
  commands:
    - Rscript test-package.R

about:
  home: https://github.com/bbtheo/cuplyr
  dev_url: https://github.com/bbtheo/cuplyr
  doc_url: https://bbtheo.github.io/cuplyr/
  summary: GPU-accelerated data manipulation with dplyr syntax via RAPIDS libcudf.
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - bbtheo
