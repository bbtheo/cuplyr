# Build variants for the r-cuplyr conda package (recipe.yaml and meta.yaml).
# Pass this file to the build tool with -m / --variant-config.
#
# Each value gives a separate binary. RAPIDS has no ABI across series: a
# cuplyr built against libcudf 26.10 needs libcudf 26.10, so there is one
# package per RAPIDS series. The series are quoted: unquoted, 26.10 is read
# as the number 26.1.
#
# To also build the oldest supported series, add "26.02" to rapids_version
# (or pass --variant rapids_version=26.02 to rattler-build). configure
# rejects a series older than 26.02.
rapids_version:
  - "26.10"

# CUDA major version of the toolkit and of the libcudf build.
cuda_version:
  - "13"
