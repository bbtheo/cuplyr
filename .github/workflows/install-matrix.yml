name: Install Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      method:
        description: "Install path to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - pixi
          - conda
          - system

permissions:
  contents: read

jobs:
  install:
    name: "${{ matrix.method }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests run every method; a manual run can pick one.
        method: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["pixi","conda","system"]' || (github.event.inputs.method != 'all' && format('["{0}"]', github.event.inputs.method) || '["pixi","conda","system"]')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install R build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      # Not r-lib/actions/setup-r-dependencies: it nests quarto-dev/quarto-actions,
      # which the repository's allowed-actions policy rejects for the whole workflow.
      - name: Cache R package dependencies
        if: ${{ matrix.method == 'pixi' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.R_LIBS_USER }}
            !${{ env.R_LIBS_USER }}/cuplyr
          key: r-deps-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-deps-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Install R package dependencies
        if: ${{ matrix.method == 'pixi' }}
        shell: Rscript {0}
        run: |
          # pak comes from the r-lib binary repo, into its own library so it is
          # neither cached nor visible to the pixi R; the deps go to R_LIBS_USER.
          pak_lib <- file.path(Sys.getenv("RUNNER_TEMP"), "pak")
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(pak_lib, recursive = TRUE, showWarnings = FALSE)
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          install.packages("pak", lib = pak_lib, repos = sprintf(
            "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.Version()$os, R.Version()$arch))
          library(pak, lib.loc = pak_lib)
          pak::local_install_deps(".", lib = lib, upgrade = FALSE,
                                  dependencies = c("Config/Needs/build", "hard"))

      - name: Setup pixi
        if: ${{ matrix.method == 'pixi' }}
        uses: prefix-dev/setup-pixi@v0

      - name: Install via pixi
        if: ${{ matrix.method == 'pixi' }}
        env:
          CUPLYR_ALLOW_CUDA_STUBS: "1"
          CUPLYR_CUDA_MIN_VERSION: "12.2"
        run: |
          pixi run install
          pixi run -- R -q -e "library(cuplyr); stopifnot(utils::packageVersion('cuplyr') >= '0.0.1')"

      - name: Setup Miniconda (mamba)
        if: ${{ matrix.method == 'conda' }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          use-mamba: true
          auto-update-conda: true
          activate-environment: base
          channels: rapidsai,conda-forge,nvidia
          channel-priority: strict

      - name: Install via conda path
        if: ${{ matrix.method == 'conda' }}
        env:
          CUPLYR_ALLOW_CUDA_STUBS: "1"
          CUPLYR_CUDA_MIN_VERSION: "12.2"
        run: |
          ./install.sh --method=conda --verbose
          R -q -e "library(cuplyr); stopifnot(utils::packageVersion('cuplyr') >= '0.0.1')"

      - name: System path dry-run
        if: ${{ matrix.method == 'system' }}
        run: |
          ./install.sh --method=system --dry-run --verbose
